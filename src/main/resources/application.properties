spring.application.name=foodsave-backend
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.mvc.locale=en_US
spring.mvc.locale-resolver=accept-header
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
foodsave.auth.secret=${FOODSAVE_AUTH_SECRET:local-foodsave-secret-change-before-deploy-0123456789}
foodsave.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://frontfoodsave.web.app}
